<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Spectral valleys and failure cliffs</title>
  <desc id="desc">A structured eigenvalue spectrum above a performance landscape with broad success valleys and sharp failure cliffs.</desc>
  <rect width="1200" height="600" fill="#f7f3eb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="62" fill="#152638" font-size="28" font-weight="700">STRUCTURED SPECTRAL LANDSCAPE</text>
    <text x="72" y="98" fill="#65717b" font-size="20">where does greedy selection succeed?</text>

    <g transform="translate(75 145)">
      <line x1="0" y1="250" x2="480" y2="250" stroke="#9aa6af" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="250" stroke="#9aa6af" stroke-width="2"/>
      <g fill="#416d94">
        <rect x="18" y="20" width="34" height="230"/>
        <rect x="62" y="34" width="34" height="216"/>
        <rect x="106" y="48" width="34" height="202"/>
        <rect x="150" y="65" width="34" height="185"/>
        <rect x="194" y="84" width="34" height="166"/>
      </g>
      <g fill="#9eb6ca">
        <rect x="238" y="157" width="34" height="93"/>
        <rect x="282" y="164" width="34" height="86"/>
        <rect x="326" y="171" width="34" height="79"/>
      </g>
      <g fill="#416d94">
        <rect x="370" y="215" width="34" height="35"/>
        <rect x="414" y="222" width="34" height="28"/>
      </g>
      <path d="M226 112 L226 265" stroke="#b64d45" stroke-width="4" stroke-dasharray="9 8"/>
      <path d="M358 186 L358 265" stroke="#b64d45" stroke-width="4" stroke-dasharray="9 8"/>
      <text x="80" y="292" fill="#65717b" font-size="19">eigenvalue index</text>
      <text x="-8" y="-18" fill="#65717b" font-size="19">magnitude</text>
      <text x="210" y="330" fill="#416d94" font-size="20" font-weight="700">stable-rank windows</text>
    </g>

    <path d="M610 380 C670 370 678 228 748 226 C816 224 820 378 886 379 C947 380 954 152 1020 151 C1063 151 1083 205 1128 214"
      fill="none" stroke="#152638" stroke-width="10" stroke-linecap="round"/>
    <path d="M640 380 C690 380 700 315 735 282" fill="none" stroke="#416d94" stroke-width="28" opacity=".22"/>
    <path d="M846 379 C900 380 923 300 950 235" fill="none" stroke="#416d94" stroke-width="28" opacity=".22"/>

    <text x="647" y="438" fill="#416d94" font-size="22" font-weight="700">SUCCESS VALLEY</text>
    <text x="846" y="438" fill="#416d94" font-size="22" font-weight="700">SUCCESS VALLEY</text>
    <path d="M1018 118 L1018 166" stroke="#b64d45" stroke-width="5"/>
    <path d="M1006 151 L1018 168 L1030 151" fill="none" stroke="#b64d45" stroke-width="5"/>
    <text x="945" y="94" fill="#b64d45" font-size="22" font-weight="700">FAILURE CLIFF</text>

    <line x1="610" y1="492" x2="1130" y2="492" stroke="#9aa6af" stroke-width="2"/>
    <text x="788" y="532" fill="#65717b" font-size="20">target cardinality k</text>
  </g>
</svg>
